<!DOCTYPE html>
<html lang="en">

<head>
  <script>
    (function () {
      const root = document.documentElement;
      fetch('http://localhost:3000/theme')
        .then(res => res.json())
        .then(data => {
          if (data.mode === 'light') {
            root.classList.add('light-mode');
            document.body && document.body.classList.add('light-mode');
          } else {
            root.classList.remove('light-mode');
            document.body && document.body.classList.remove('light-mode');
          }
          if (data.color === 'neon') {
            root.classList.add('theme-neon');
          } else {
            root.classList.remove('theme-neon');
          }
        })
        .catch(err => console.warn("Failed to fetch theme from DB on load:", err));
    })();
  </script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity Details · CUSTOMER360</title>
  <!-- Link relative stylesheets -->
  <link rel="stylesheet" href="../../fonts/fonts.css" />
  <link rel="stylesheet" href="../../style.css" />

  <style>
    /* Standalone overrides and additions */
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      background: var(--bg);
      color: var(--text);
      font-family: 'Outfit', sans-serif;
      margin: 0;
      position: relative;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, var(--aurora-1), transparent 50%),
                  radial-gradient(circle at 80% 20%, var(--aurora-2), transparent 50%),
                  radial-gradient(circle at 20% 80%, var(--aurora-3), transparent 50%);
      z-index: -1;
      pointer-events: none;
    }

    .activity-detail-container {
      width: 100%;
      max-width: 600px;
      animation: scaleUp 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    @keyframes scaleUp {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .detail-card {
      padding: 30px;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: var(--glass);
      box-shadow: var(--shadow);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      position: relative;
      overflow: hidden;
      min-height: 250px;
    }

    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 18px;
      margin-bottom: 25px;
    }

    .detail-title-group {
      display: flex;
      flex-direction: column;
    }

    .detail-title-group h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      margin: 0;
      text-transform: uppercase;
      color: var(--text);
    }

    .detail-title-group span {
      font-size: 13px;
      color: var(--muted);
      margin-top: 3px;
    }

    .close-btn {
      background: var(--glass);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      padding: 8px 16px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      transition: background-color var(--transition), border-color var(--transition), transform 0.2s ease;
      font-family: inherit;
    }

    .close-btn:hover {
      background: var(--glass2);
      border-color: var(--accent);
      box-shadow: 0 0 8px var(--glow-shadow);
      transform: translateY(-1px);
    }

    .detail-hero-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--glass2);
      border: 1px solid var(--border);
      box-shadow: 0 0 15px var(--glow-shadow);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      margin: 0 auto 20px auto;
    }

    .detail-section-title {
      font-size: 12px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 15px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 25px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 6px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      padding: 14px 18px;
      border-radius: 12px;
    }

    .light-mode .detail-item {
      background: rgba(0, 0, 0, 0.01);
    }

    .detail-item.full-width {
      grid-column: 1 / -1;
    }

    .detail-label {
      font-size: 10px;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .detail-value {
      font-size: 14.5px;
      font-weight: 600;
      color: var(--text);
    }

    .activity-badge {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .badge-theme-appointment {
      background: rgba(59, 130, 246, 0.15);
      color: #3b82f6;
      border-color: rgba(59, 130, 246, 0.3);
    }

    .badge-theme-task {
      background: rgba(245, 158, 11, 0.15);
      color: #f59e0b;
      border-color: rgba(245, 158, 11, 0.3);
    }

    .badge-theme-call {
      background: rgba(16, 185, 129, 0.15);
      color: #10b981;
      border-color: rgba(16, 185, 129, 0.3);
    }

    .badge-theme-event {
      background: rgba(139, 92, 246, 0.15);
      color: #8b5cf6;
      border-color: rgba(139, 92, 246, 0.3);
    }

    .badge-theme-generic {
      background: rgba(107, 114, 128, 0.15);
      color: #6b7280;
      border-color: rgba(107, 114, 128, 0.3);
    }

    .detail-desc-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 13.5px;
      color: var(--text);
      line-height: 1.6;
    }

    .light-mode .detail-desc-box {
      background: rgba(0, 0, 0, 0.01);
    }

    .user-tag {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      background: var(--glass2);
      border: 1px solid var(--border);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      margin-right: 6px;
      margin-top: 4px;
    }
  </style>
</head>

<body class="dark-mode">
  <div class="activity-detail-container">
    <div class="detail-card">
      <div class="detail-header">
        <div class="detail-title-group">
          <h1 id="detail-header-title">Activity File</h1>
          <span>Detailed activity record</span>
        </div>
        <a class="close-btn" href="#" onclick="closeOrBack(); return false;">Close</a>
      </div>

      <!-- Preloader / Error containers managed by UI renderer -->
      <div class="detail-content" style="display: none;">
        <div class="detail-hero-icon" id="detail-hero-icon">🔔</div>

        <h3 class="detail-section-title">Record Information</h3>

        <div class="detail-grid">
          <div class="detail-item">
            <span class="detail-label">Activity ID</span>
            <span class="detail-value" id="detail-activity-id">-</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">Customer ID</span>
            <span class="detail-value" id="detail-customer-id">-</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">Subject / Purpose</span>
            <span class="detail-value" id="detail-purpose">-</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">Activity Type</span>
            <div id="detail-type-badge">
              <span class="activity-badge badge-theme-generic">Generic</span>
            </div>
          </div>

          <div class="detail-item">
            <span class="detail-label">Date & Time</span>
            <span class="detail-value" id="detail-date">-</span>
          </div>

          <div class="detail-item" id="item-location-container">
            <span class="detail-label">Location / Channel</span>
            <span class="detail-value" id="detail-location">-</span>
          </div>

          <div class="detail-item full-width" id="item-assigned-users-container">
            <span class="detail-label">Assigned Users</span>
            <div id="detail-assigned-users" style="display: flex; flex-wrap: wrap;">
              <span class="detail-value">-</span>
            </div>
          </div>

          <div class="detail-item full-width">
            <span class="detail-label">Description & Background Notes</span>
            <div class="detail-desc-box" id="detail-desc">
              -
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- JavaScript Integration -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="../../config.js"></script>
  <script src="../../api-service.js"></script>
  <script src="../../ui-renderer.js"></script>
  <script>
    function closeOrBack() {
      if (window.opener) {
        window.close();
      } else {
        const urlParams = new URLSearchParams(window.location.search);
        const customerId = urlParams.get('customerId');
        const searchUrl = (window.API_CONFIG && window.API_CONFIG.CUSTOMER_SEARCH_URL) || '../../customer-search/customer-search.html';
        const target = customerId ? `../../index.html?customerId=${encodeURIComponent(customerId)}` : `../../${searchUrl}`;
        window.location.href = target;
      }
    }

    function loadActivityDetails() {
      const urlParams = new URLSearchParams(window.location.search);
      const activityId = urlParams.get('id');
      
      if (!activityId) {
        UIRenderer.showError('.detail-card', 'Missing Activity identifier in URL.', function () {
          closeOrBack();
        });
        return;
      }

      UIRenderer.showLoader('.detail-card');

      const endpoint = window.API_CONFIG && window.API_CONFIG.ENDPOINTS && window.API_CONFIG.ENDPOINTS.ACTIVITIES;
      ApiService.get(
        endpoint,
        function (response) {
          UIRenderer.hideLoader('.detail-card');
          
          let dataList = null;
          if (response && response.data) {
            dataList = response.data;
          } else if (Array.isArray(response)) {
            dataList = response;
          }

          const item = (dataList || []).find(c => String(c.id) === String(activityId));
          
          if (!item) {
            UIRenderer.showError('.detail-card', `Activity not found: ${activityId}`, function () {
              closeOrBack();
            });
            return;
          }

          // Dynamic Icons and Titles
          const type = item.type || 'generic';
          const typeLower = type.toLowerCase();
          
          let icon = '🔔';
          let badgeClass = 'badge-theme-generic';
          let prefix = 'ACT';
          
          if (typeLower === 'appointment') {
            icon = '📅';
            badgeClass = 'badge-theme-appointment';
            prefix = 'APT';
            $('#detail-header-title').text('Appointment File');
          } else if (typeLower === 'task') {
            icon = '✔️';
            badgeClass = 'badge-theme-task';
            prefix = 'TSK';
            $('#detail-header-title').text('Task File');
          } else if (typeLower === 'call') {
            icon = '📞';
            badgeClass = 'badge-theme-call';
            prefix = 'CAL';
            $('#detail-header-title').text('Call Record');
          } else if (typeLower === 'event') {
            icon = '🎉';
            badgeClass = 'badge-theme-event';
            prefix = 'EVT';
            $('#detail-header-title').text('Event File');
          } else if (typeLower === 'visit') {
            icon = '🏠';
            badgeClass = 'badge-theme-call';
            prefix = 'VST';
            $('#detail-header-title').text('Site Visit File');
          } else {
            $('#detail-header-title').text('Activity File');
          }

          $('#detail-hero-icon').text(icon);
          
          // Activity ID
          $('#detail-activity-id').text(prefix + '-' + item.id + '-' + Math.floor(1000 + Math.random() * 9000));
          $('#detail-customer-id').text(item.customerId || item.customer || '-');
          $('#detail-purpose').text(item.title || '-');
          
          // Type Badge
          $('#detail-type-badge').html(`<span class="activity-badge ${badgeClass}">${type.charAt(0).toUpperCase() + type.slice(1)}</span>`);

          // Format Date
          let displayDate = item.date || '';
          try {
            const parsed = new Date(item.date);
            if (!isNaN(parsed.getTime())) {
              const options = { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' };
              displayDate = parsed.toLocaleDateString('en-US', options);
            }
          } catch(e) {}
          $('#detail-date').text(displayDate);
          
          // Location (Always show location, fallback if not specified)
          $('#detail-location').text(item.location || 'N/A');
          $('#item-location-container').show();
          
          // Description
          $('#detail-desc').text(item.subtitle || 'No further notes provided.');

          // Assigned Users (Always show, fallback if empty)
          const usersDiv = $('#detail-assigned-users');
          usersDiv.empty();
          const usersList = item.assignedUsers || [];
          if (usersList.length > 0) {
            usersList.forEach(user => {
              usersDiv.append(`<span class="user-tag">👥 ${user}</span>`);
            });
            $('#item-assigned-users-container').show();
          } else {
            usersDiv.append('<span class="detail-value">Not Assigned</span>');
            $('#item-assigned-users-container').show();
          }

          // Show Content
          $('.detail-content').fadeIn(300);
        },
        function (errorMsg) {
          UIRenderer.hideLoader('.detail-card');
          UIRenderer.showError('.detail-card', 'Failed to retrieve activity details: ' + errorMsg, function () {
            loadActivityDetails();
          });
        }
      );
    }

    $(document).ready(function () {
      loadActivityDetails();
    });
  </script>
</body>

</html>
