<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <!-- Monochrome Gradients -->
    <linearGradient id="folderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.16)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)" />
    </linearGradient>
    <linearGradient id="glowSilver" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
  </defs>

  <style>
    /* Swaying leaves */
    @keyframes swayLeaf {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(3deg); }
    }

    /* Magnifying glass scan orbit */
    @keyframes scanGlass {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      50% { transform: translate(-10px, 6px) rotate(-15deg); }
    }

    /* Folder hovering */
    @keyframes floatFolder {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }

    /* Key breathing glow */
    @keyframes keyFloat {
      0%, 100% { transform: translateY(0px) rotate(5deg); filter: drop-shadow(0 0 2px rgba(148,163,184,0.4)); }
      50% { transform: translateY(-4px) rotate(0deg); filter: drop-shadow(0 0 8px rgba(148,163,184,0.75)); }
    }

    .folder-group { animation: floatFolder 4.5s ease-in-out infinite; transform-origin: 150px 110px; }

    .scanner-glass { animation: scanGlass 3.5s ease-in-out infinite; transform-origin: 130px 100px; }

    .security-key { animation: keyFloat 3s ease-in-out infinite; transform-origin: 75px 115px; }

    .leaf-1 { animation: swayLeaf 6s ease-in-out infinite; transform-origin: 40px 220px; }
    .leaf-2 { animation: swayLeaf 5s ease-in-out infinite 1s; transform-origin: 260px 220px; }
  </style>

  <!-- Background Decorative Grid Lines -->
  <line x1="0" y1="40" x2="300" y2="40" stroke="#f1f5f9" stroke-width="1" />
  <line x1="0" y1="80" x2="300" y2="80" stroke="#f1f5f9" stroke-width="1" />
  <line x1="0" y1="120" x2="300" y2="120" stroke="#f1f5f9" stroke-width="1" />
  <line x1="0" y1="160" x2="300" y2="160" stroke="#f1f5f9" stroke-width="1" />
  <line x1="0" y1="200" x2="300" y2="200" stroke="#f1f5f9" stroke-width="1" />
  
  <line x1="50" y1="0" x2="50" y2="240" stroke="#f1f5f9" stroke-width="1" />
  <line x1="100" y1="0" x2="100" y2="240" stroke="#f1f5f9" stroke-width="1" />
  <line x1="150" y1="0" x2="150" y2="240" stroke="#f1f5f9" stroke-width="1" />
  <line x1="200" y1="0" x2="200" y2="240" stroke="#f1f5f9" stroke-width="1" />
  <line x1="250" y1="0" x2="250" y2="240" stroke="#f1f5f9" stroke-width="1" />

  <!-- Floor line -->
  <line x1="20" y1="200" x2="280" y2="200" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Ambient Glow behind binder (Gray/Silver) -->
  <circle cx="150" cy="110" r="55" fill="url(#silverGrad)" opacity="0.15" filter="blur(25px)" />

  <!-- Subject 1: Corporate Document Binder (Centered & Floating) -->
  <g class="folder-group">
    <!-- Binder Shadow -->
    <rect x="94" y="58" width="112" height="96" rx="6" fill="rgba(0,0,0,0.2)" filter="blur(4px)" transform="translate(0, 4)" />
    
    <!-- Main Back Cover -->
    <rect x="90" y="54" width="120" height="96" rx="6" fill="url(#folderGrad)" stroke="#475569" stroke-width="2" />
    
    <!-- Document Pages Inside (Slightly smaller, offset upwards to look opened) -->
    <g id="document-sheets">
      <rect x="96" y="44" width="108" height="84" rx="4" fill="url(#pageGrad)" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" />
      <!-- Mock lines representing financial table details -->
      <line x1="106" y1="56" x2="194" y2="56" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" />
      <line x1="106" y1="68" x2="174" y2="68" stroke="#64748b" stroke-width="2.2" stroke-linecap="round" />
      <line x1="106" y1="80" x2="186" y2="80" stroke="#94a3b8" stroke-width="2.2" stroke-linecap="round" />
      <line x1="106" y1="92" x2="152" y2="92" stroke="#475569" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="2 2" />
    </g>

    <!-- Front Cover Flap overlay (representing binder bottom binder mechanism) -->
    <path d="M 90 120 L 210 120 L 210 150 L 90 150 Z" fill="url(#folderGrad)" opacity="0.95" />
    <!-- Binder spine line -->
    <line x1="90" y1="120" x2="210" y2="120" stroke="#475569" stroke-width="1.5" />

    <!-- Golden Bank Seal Emblem - now Silver/Slate in center of flap -->
    <circle cx="150" cy="135" r="10" fill="url(#silverGrad)" stroke="#94a3b8" stroke-width="1" />
    <path d="M 147 135 L 149 137 L 153 133" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" />
  </g>

  <!-- Subject 2: Floating Silver/Gray Security Key -->
  <g class="security-key" id="golden-key">
    <!-- Key Halo Glow -->
    <circle cx="75" cy="115" r="14" fill="url(#glowSilver)" opacity="0.25" filter="blur(8px)" />
    <!-- Key Ring head -->
    <circle cx="75" cy="115" r="8" fill="none" stroke="url(#silverGrad)" stroke-width="2.5" />
    <!-- Key shaft -->
    <line x1="83" y1="115" x2="101" y2="115" stroke="url(#silverGrad)" stroke-width="3.2" stroke-linecap="round" />
    <!-- Key bits -->
    <line x1="94" y1="115" x2="94" y2="122" stroke="url(#silverGrad)" stroke-width="2.8" stroke-linecap="round" />
    <line x1="99" y1="115" x2="99" y2="122" stroke="url(#silverGrad)" stroke-width="2.8" stroke-linecap="round" />
  </g>

  <!-- Floating Magnifying glass scanning pages (Centered - Gray/Slate) -->
  <g class="scanner-glass" transform="translate(0, 0)">
    <!-- Lens Glow Ring -->
    <circle cx="150" cy="100" r="16" fill="none" stroke="#64748b" stroke-width="2" />
    <circle cx="150" cy="100" r="13" fill="rgba(255,255,255,0.05)" />
    <!-- Handle -->
    <line x1="140" y1="110" x2="126" y2="124" stroke="#64748b" stroke-width="3.5" stroke-linecap="round" />
  </g>

  <!-- Botanical Base Ornaments (Monochrome Muted Grays) -->
  <g class="leaf-1" id="plant-left">
    <path d="M 15 200 C 15 180 35 175 45 182 C 55 178 70 185 68 200 Z" fill="#cbd5e1" opacity="0.4" />
    <path d="M 28 200 C 28 185 45 180 52 188 C 60 184 72 190 70 200 Z" fill="#94a3b8" opacity="0.5" />
  </g>
  <g class="leaf-2" id="plant-right">
    <path d="M 225 200 C 225 185 242 180 250 188 C 258 184 270 190 268 200 Z" fill="#cbd5e1" opacity="0.4" />
    <path d="M 240 200 C 240 180 260 175 270 182 C 280 178 295 185 293 200 Z" fill="#94a3b8" opacity="0.5" />
    <path d="M 260 200 C 265 170 278 165 275 200" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
