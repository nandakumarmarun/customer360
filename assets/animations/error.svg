<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <!-- Monochrome Gradients -->
    <linearGradient id="alertGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
    <linearGradient id="atmBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>

  <style>
    /* Warning beacon pulsing */
    @keyframes beaconPulse {
      0%, 100% { opacity: 0.15; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(1.4); }
    }

    /* Screen caution icon shaking */
    @keyframes cautionShake {
      0%, 100% { transform: translate(0px, 0px) rotate(0deg); }
      20% { transform: translate(-1px, 1px) rotate(-1.5deg); }
      40% { transform: translate(1px, -1px) rotate(1.5deg); }
      60% { transform: translate(-1.5px, -1px) rotate(-0.5deg); }
      80% { transform: translate(1px, 1px) rotate(0.5deg); }
    }

    /* Card flashing status indicator */
    @keyframes cardIndicator {
      0%, 100% { fill: #94a3b8; filter: drop-shadow(0 0 2px #94a3b8); }
      50% { fill: #4b5563; }
    }

    /* Swaying leaves */
    @keyframes swayLeaf {
      0%, 100% { transform: rotate(0deg); }
      50% { transform: rotate(3deg); }
    }

    .beacon-glow { animation: beaconPulse 2s ease-in-out infinite; transform-origin: 150px 38px; }

    .caution-symbol { animation: cautionShake 1.8s ease-in-out infinite; transform-origin: 150px 96px; }

    .status-led { animation: cardIndicator 1s infinite steps(1); }

    .leaf-1 { animation: swayLeaf 6s ease-in-out infinite; transform-origin: 40px 220px; }
    .leaf-2 { animation: swayLeaf 5s ease-in-out infinite 1s; transform-origin: 260px 220px; }
  </style>

  <!-- Background Decorative Grid Lines -->
  <line x1="0" y1="40" x2="300" y2="40" stroke="#f1f5f9" stroke-width="1" />
  <line x1="0" y1="80" x2="300" y2="80" stroke="#f1f5f9" stroke-width="1" />
  <line x1="0" y1="120" x2="300" y2="120" stroke="#f1f5f9" stroke-width="1" />
  <line x1="0" y1="160" x2="300" y2="160" stroke="#f1f5f9" stroke-width="1" />
  <line x1="0" y1="200" x2="300" y2="200" stroke="#f1f5f9" stroke-width="1" />
  
  <line x1="50" y1="0" x2="50" y2="240" stroke="#f1f5f9" stroke-width="1" />
  <line x1="100" y1="0" x2="100" y2="240" stroke="#f1f5f9" stroke-width="1" />
  <line x1="150" y1="0" x2="150" y2="240" stroke="#f1f5f9" stroke-width="1" />
  <line x1="200" y1="0" x2="200" y2="240" stroke="#f1f5f9" stroke-width="1" />
  <line x1="250" y1="0" x2="250" y2="240" stroke="#f1f5f9" stroke-width="1" />

  <!-- Floor line -->
  <line x1="20" y1="200" x2="280" y2="200" stroke="#cbd5e1" stroke-width="1.5" />

  <!-- Subject 1: Alarm Beacon Beacon on top of ATM -->
  <circle class="beacon-glow" cx="150" cy="38" r="30" fill="url(#alertGrad)" opacity="0.25" filter="blur(15px)" />
  <path d="M 144 48 L 156 48 L 158 38 A 8 8 0 0 0 142 38 Z" fill="url(#alertGrad)" stroke="#94a3b8" stroke-width="1" />

  <!-- Subject 2: ATM Terminal Console (Centered) -->
  <g id="atm-console">
    <!-- Main Cabinet Frame -->
    <rect x="90" y="48" width="120" height="135" rx="6" fill="url(#atmBodyGrad)" stroke="#475569" stroke-width="2.5" />
    
    <!-- Screen Bezel -->
    <rect x="100" y="58" width="100" height="66" rx="4" fill="url(#screenGrad)" stroke="#64748b" stroke-width="1.5" />

    <!-- Caution exclamation mark shaking on screen -->
    <g class="caution-symbol">
      <path d="M 150 68 L 163 92 L 137 92 Z" fill="url(#alertGrad)" stroke="#94a3b8" stroke-width="1" stroke-linejoin="round" />
      <line x1="150" y1="76" x2="150" y2="84" stroke="#fff" stroke-width="2.2" stroke-linecap="round" />
      <circle cx="150" cy="89" r="1.5" fill="#fff" />
    </g>

    <!-- Error Screen Status Text -->
    <text x="150" y="108" text-anchor="middle" fill="#94a3b8" font-size="6.5" font-family="monospace" font-weight="bold" opacity="0.9">SERVICE OFFLINE</text>
    <text x="150" y="116" text-anchor="middle" fill="#64748b" font-size="5" font-family="monospace" opacity="0.6">ERR_API_CONNECT_FAIL</text>

    <!-- Lower ATM Slots -->
    <!-- Card Slot -->
    <rect x="105" y="138" width="40" height="12" rx="2" fill="#1e293b" />
    <!-- Flashing LED next to slot -->
    <circle class="status-led" cx="154" cy="144" r="2.5" />

    <!-- Half-Inserted Bank Card -->
    <rect x="110" y="142" width="30" height="18" rx="2" fill="url(#cardGrad)" transform="rotate(-5, 110, 142)" stroke="rgba(255,255,255,0.2)" stroke-width="0.5" />
    <!-- Card magnetic strip mock -->
    <rect x="111" y="146" width="28" height="4" fill="#0f172a" opacity="0.8" transform="rotate(-5, 110, 142)" />

    <!-- Cash Dispenser Slot -->
    <rect x="105" y="158" width="55" height="6" rx="1.5" fill="#1e293b" />
  </g>

  <!-- Botanical Base Ornaments (Monochrome Muted Grays) -->
  <g class="leaf-1" id="plant-left">
    <path d="M 15 200 C 15 180 35 175 45 182 C 55 178 70 185 68 200 Z" fill="#cbd5e1" opacity="0.4" />
    <path d="M 28 200 C 28 185 45 180 52 188 C 60 184 72 190 70 200 Z" fill="#94a3b8" opacity="0.5" />
  </g>
  <g class="leaf-2" id="plant-right">
    <path d="M 225 200 C 225 185 242 180 250 188 C 258 184 270 190 268 200 Z" fill="#cbd5e1" opacity="0.4" />
    <path d="M 240 200 C 240 180 260 175 270 182 C 280 178 295 185 293 200 Z" fill="#94a3b8" opacity="0.5" />
    <path d="M 260 200 C 265 170 278 165 275 200" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" />
  </g>
</svg>
